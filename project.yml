name: ClaudeLimit

options:
  bundleIdPrefix: com.batuhanakpunar
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES

packages:
  LimitCore:
    path: .

targets:
  ClaudeLimit:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: LimitCore
        product: LimitCore
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Claude Limit
        CFBundleDisplayName: Claude Limit
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "15.0"
        # Menü çubuğu uygulaması: Dock ikonu ve ana pencere yok.
        LSUIElement: true
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.batuhanakpunar.claudelimit
        PRODUCT_NAME: Claude Limit
        # Sandbox kapalı. Sandboxed bir uygulama ~/.claude ve başka bir
        # uygulamanın Application Support klasörünü okuyamaz.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
