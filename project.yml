name: ClaudeLimit

options:
  bundleIdPrefix: com.batuhanakpunar
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "3"
    DEAD_CODE_STRIPPING: YES

packages:
  LimitCore:
    path: .
  # Otomatik güncelleme. App Store dışı macOS uygulamalarının standart yolu:
  # EdDSA ile imzalı bir besleme (appcast) okuyor, imzayı uygulamaya gömülü
  # açık anahtarla doğruluyor, sonra indirip yerine koyuyor.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  ClaudeLimit:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: LimitCore
        product: LimitCore
      - package: Sparkle
        product: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Claude Limit
        CFBundleDisplayName: Claude Limit
        # Sürüm derleme ayarlarından (MARKETING_VERSION / CURRENT_PROJECT_VERSION).
        # Elle yazılı olduğunda yayın betiği project.yml'deki sayıyı artırsa da
        # uygulamanın içindeki sürüm değişmiyordu; güncelleme sistemi yeni
        # sürümü eskisinden ayırt edemezdi.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "15.0"
        # Menü çubuğu uygulaması: Dock ikonu ve ana pencere yok.
        LSUIElement: true
        NSHumanReadableCopyright: ""
        # ── Otomatik güncelleme (Sparkle) ──
        # Besleme her yayının kendi ek dosyası: "latest" her zaman en yeni
        # yayının appcast.xml'ine yönlenir, ayrı bir sunucu ya da dal gerekmez.
        SUFeedURL: https://github.com/BatuhanAkpunar/ClaudeTakip/releases/latest/download/appcast.xml
        SUPublicEDKey: bMRNoXt1lA1b9l8AchnNNeIp0oLk3J5Z1eLIIgsZVYU=
        # Kullanıcıya "otomatik denetlensin mi" diye sorulmuyor: açık gelir.
        SUEnableAutomaticChecks: true
        # Bulunan güncelleme sessizce indirilir ve kurulur.
        SUAutomaticallyUpdate: true
        # Saatte bir denetim: besleme birkaç KB, maliyeti yok denecek kadar az.
        # Günlük denetim (86400 sn): menü çubuğu uygulaması sürekli açık,
        # günde bir kez yeterli. Kullanıcı ayarlardan elle de tetikleyebilir.
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.batuhanakpunar.claudelimit
        PRODUCT_NAME: Claude Limit
        # Sandbox kapalı. Sandboxed bir uygulama ~/.claude ve başka bir
        # uygulamanın Application Support klasörünü okuyamaz.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
